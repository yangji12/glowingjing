<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdLab</title>
  <meta name="description" content="A classroom simulator for practicing Google Ads-style Search, Display, YouTube and Shopping campaigns with simulated results, scoring and feedback.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a73e8'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='18' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <button id="menu-btn" class="menu-btn" aria-label="Open menu">☰</button>
    <span class="topbar-title">AdLab</span>
  </header>
  <aside id="nav" class="nav" aria-label="Main navigation"></aside>
  <main id="main" class="main" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="textbox" class="textbox" hidden><div class="textbox-inner" role="dialog" aria-modal="true" aria-labelledby="textbox-title"><h3 id="textbox-title"></h3><p class="help">Downloads are blocked here. Copy the text and save it as a file, or paste it into a spreadsheet.</p><textarea id="textbox-text" rows="12" readonly></textarea><div class="row"><button type="button" class="btn primary" data-copy>Copy</button><button type="button" class="btn ghost" data-close>Close</button></div></div></div>
  <noscript>AdLab needs JavaScript enabled.</noscript>
  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/model.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/previews.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
